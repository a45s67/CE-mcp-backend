name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --group build
      - name: Test core models and storage
        run: >-
          uv run --locked python -m unittest -v
          tests.test_artifacts tests.test_audit tests.test_models tests.test_policy
          tests.test_protocol tests.test_structures
      - name: Test service and transports
        run: >-
          uv run --locked python -m unittest -v
          tests.test_service tests.test_transport
      - name: Test MCP and public contracts
        run: >-
          uv run --locked python -m unittest -v
          tests.test_mcp_adapter tests.test_mcp_metadata tests.test_mcp_wire_contracts
          tests.test_schema_contracts tests.test_tool_contracts
      - name: Test runtime and release scripts
        run: >-
          uv run --locked python -m unittest -v
          tests.test_install_bridge tests.test_lua_bridge tests.test_mcp_stdio_integration
          tests.test_release_scripts tests.test_server_config
      - name: Test scripted smoke workflows
        run: >-
          uv run --locked python -m unittest -v
          tests.test_cli tests.test_e2e_smoke tests.test_performance_smoke
      - name: Build Python distributions
        run: uv build --no-sources
      - name: Build standalone Windows release
        shell: powershell
        run: .\scripts\build-standalone.ps1
      - name: Verify release manifest
        run: uv run --locked python .\scripts\verify-release.py .\dist\ce-mcp-windows-x64
      - name: Verify isolated installation and upgrade
        shell: powershell
        run: .\scripts\verify-installer.ps1
      - name: Verify compiled MCP transports
        run: uv run --locked python .\scripts\verify-compiled.py --server .\dist\ce-mcp-windows-x64\mcp\server.exe
      - name: Upload standalone release
        uses: actions/upload-artifact@v7
        with:
          name: ce-mcp-windows-x64
          path: dist/ce-mcp-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
