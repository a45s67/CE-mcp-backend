name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --group build
      - name: Test core models and storage
        run: >-
          uv run --locked python -m unittest -v
          tests.test_artifacts tests.test_audit tests.test_models tests.test_policy
          tests.test_protocol tests.test_structures
      - name: Test service and transports
        run: >-
          uv run --locked python -m unittest -v
          tests.test_service tests.test_transport
      - name: Test MCP and public contracts
        run: >-
          uv run --locked python -m unittest -v
          tests.test_mcp_adapter tests.test_mcp_metadata tests.test_mcp_wire_contracts
          tests.test_schema_contracts tests.test_tool_contracts
      - name: Test bridge installer packaged path
        run: >-
          uv run --locked python -m unittest -v
          tests.test_install_bridge.InstallBridgeTests.test_packaged_path_falls_back_to_source_checkout_for_editable_install
      - name: Test bridge installer atomic update
        run: >-
          uv run --locked python -m unittest -v
          tests.test_install_bridge.InstallBridgeTests.test_installs_atomically_and_refuses_implicit_overwrite
      - name: Test bridge installer directory validation
        run: >-
          uv run --locked python -m unittest -v
          tests.test_install_bridge.InstallBridgeTests.test_rejects_non_ce_directory
      - name: Test Lua bridge contracts
        run: uv run --locked python -m unittest -v tests.test_lua_bridge
      - name: Test MCP stdio integration
        run: uv run --locked python -m unittest -v tests.test_mcp_stdio_integration
      - name: Test release scripts
        run: uv run --locked python -m unittest -v tests.test_release_scripts
      - name: Test server configuration
        run: uv run --locked python -m unittest -v tests.test_server_config
      - name: Test scripted smoke workflows
        run: >-
          uv run --locked python -m unittest -v
          tests.test_cli tests.test_e2e_smoke tests.test_performance_smoke
      - name: Build Python distributions
        run: uv build --no-sources
      - name: Build standalone Windows release
        shell: powershell
        run: .\scripts\build-standalone.ps1
      - name: Verify release manifest
        run: uv run --locked python .\scripts\verify-release.py .\dist\ce-mcp-windows-x64
      - name: Verify isolated installation and upgrade
        shell: powershell
        run: .\scripts\verify-installer.ps1
      - name: Verify compiled MCP transports
        run: uv run --locked python .\scripts\verify-compiled.py --server .\dist\ce-mcp-windows-x64\mcp\server.exe
      - name: Upload standalone release
        uses: actions/upload-artifact@v7
        with:
          name: ce-mcp-windows-x64
          path: |
            dist/ce-mcp-windows-x64.zip
            dist/ce-mcp-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ce-mcp-windows-x64
          path: dist
      - name: Validate tagged artifact
        shell: powershell
        run: |
          $zip = '.\dist\ce-mcp-windows-x64.zip'
          $checksum = '.\dist\ce-mcp-windows-x64.zip.sha256'
          $expectedHash = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'release ZIP checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath .\dist\tag-audit
          $version = (Get-Content -LiteralPath .\dist\tag-audit\ce-mcp-windows-x64\VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match packaged version $version"
          }
      - name: Publish tagged GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\dist\ce-mcp-windows-x64.zip `
            .\dist\ce-mcp-windows-x64.zip.sha256 `
            --verify-tag `
            --title "CE MCP Backend $env:GITHUB_REF_NAME" `
            --notes-file .\.github\release-notes\v0.1.0.md
